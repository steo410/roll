<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TextRoll v0.1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">T</div>
        <div>
          <div class="brand-title">TextRoll</div>
          <div class="brand-sub">글자로 만드는 피아노 롤</div>
        </div>
      </div>

      <div class="transport">
        <button id="playBtn" class="primary">▶ 재생</button>
        <button id="stopBtn">■ 정지</button>
        <label>BPM <input id="bpmInput" type="number" min="40" max="240" value="120" /></label>
        <label>Snap
          <select id="snapSelect">
            <option value="1">1/4</option>
            <option value="0.5">1/8</option>
            <option value="0.25" selected>1/16</option>
            <option value="0">OFF</option>
          </select>
        </label>
        <label>보기
          <select id="viewMode">
            <option value="both" selected>Text + Notes</option>
            <option value="text">Text</option>
            <option value="notes">Notes</option>
          </select>
        </label>
      </div>

      <div class="top-actions">
        <button id="addTextBtn">＋ 글자</button>
        <button id="saveBtn">프로젝트 저장</button>
        <label class="file-btn">불러오기<input id="loadInput" type="file" accept="application/json,.textroll" /></label>
      </div>
    </header>

    <main class="workspace">
      <section class="editor-panel">
        <div class="hintbar">
          <span>더블클릭: 글자 추가</span>
          <span>드래그: 이동</span>
          <span>모서리 핸들: 크기 조절</span>
          <span>Delete: 삭제</span>
        </div>
        <div class="timeline-wrap">
          <canvas id="timeline"></canvas>
        </div>
      </section>

      <aside class="inspector">
        <h2>선택한 글자</h2>
        <div id="emptyInspector" class="empty-state">글자 블록을 선택하세요.</div>
        <div id="inspectorForm" class="inspector-form hidden">
          <label>텍스트
            <textarea id="textInput" rows="3"></textarea>
          </label>
          <label>악기
            <select id="trackSelect"></select>
          </label>
          <label>음량 <span id="velocityValue">80%</span>
            <input id="velocityInput" type="range" min="10" max="100" value="80" />
          </label>
          <label>노트 밀도 <span id="densityValue">70%</span>
            <input id="densityInput" type="range" min="20" max="100" value="70" />
          </label>
          <label>글자 굵기
            <select id="fontWeightInput">
              <option value="400">Regular</option>
              <option value="600" selected>Semibold</option>
              <option value="800">Bold</option>
            </select>
          </label>
          <label>옥타브 이동
            <input id="octaveInput" type="number" min="-3" max="3" value="0" />
          </label>
          <div class="metric-grid">
            <div><small>시작</small><strong id="startMetric">0.00</strong></div>
            <div><small>길이</small><strong id="lengthMetric">0.00</strong></div>
            <div><small>최저음</small><strong id="lowMetric">C4</strong></div>
            <div><small>최고음</small><strong id="highMetric">C5</strong></div>
          </div>
          <button id="deleteBtn" class="danger">선택 블록 삭제</button>
        </div>

        <hr />
        <h2>트랙</h2>
        <div id="trackList" class="track-list"></div>
        <button id="addTrackBtn" class="full">＋ 트랙 추가</button>

        <hr />
        <h2>설명</h2>
        <p class="help-copy">
          글자의 <b>가로 길이</b>는 연주 시간, <b>세로 크기/위치</b>는 음역과 음높이가 됩니다.
          글자 모양은 내부적으로 작은 음표 셀로 변환되어 실제로 연주됩니다.
        </p>
      </aside>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
